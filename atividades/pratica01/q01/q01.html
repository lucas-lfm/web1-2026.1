<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Questão 01 - Prática 01</title>

    <script src="./q01.js" defer></script>
  </head>
  <body>
    <h1>Questão 01</h1>

    <p>
      <b>Questão 01.</b> Escreva um programa que leia um valor em R$ (reais) e
      converta-o para US$ (dólar americano). Use a cotação atual do dólar.
    </p>

    <form id="formConversor">
      <label for="valorReais">Valor em R$:</label>
      <input
        type="number"
        min="0"
        step="0.01"
        id="valorReais"
        placeholder="R$ 0,00"
        required
      />

      <label for="cotacao">Cotação atual:</label>
      <input type="number" min="0" step="0.01" id="cotacao" required />

      <button type="submit">Converter para Dólar</button>
    </form>

    <p id="resultado"></p>
  </body>
</html>
